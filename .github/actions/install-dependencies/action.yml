name: "Install dependencies for deskflow"
description: "Install the dependencies needed to build deskflow"

inputs:
  like:
    description: "Used only on linux distro type: debian, fedora, suse, arch"
    required: false

  qt-version:
    description: "The version of Qt to install (Windows & macOS)"
    required: false

  vcpkg-triplet:
    description: "vcpkg triplet to use (Windows)"
    required: false

outputs:
  vcpkg-cmake-config:
    description: "windows vcpkg output for cmaket"
    value: ${{ steps.vcpkg.outputs.vcpkg-cmake-config }}

runs:
  using: "composite"

  steps:
    - name: Install Depends
      if: ${{ runner.os != 'Windows' }}
      run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew install openssl@3 --quiet
            # brew only carries the latest openssl@3, so pin the release series and record the exact version
            # the linked keg is what CMake finds; a stale keg can sit next to it
            version=$(brew info --json=v2 openssl@3 | jq -r '.formulae[0] | .linked_keg // .installed[-1].version')
            echo "OpenSSL (brew openssl@3): $version" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$version" != "$OPENSSL_SERIES".* ]]; then
              echo "::error::brew openssl@3 is $version, expected $OPENSSL_SERIES.x; update OPENSSL_SERIES in install-dependencies"
              exit 1
            fi
          elif [ "$RUNNER_OS" == "Linux" ]; then
            if [ ${{inputs.like}} == "debian" ]; then
              apt update -qqq > /dev/null
              apt install -qqq cmake build-essential ninja-build \
                xorg-dev libx11-dev libxtst-dev libssl-dev libxkbfile-dev \
                qt6-base-dev qt6-tools-dev libxkbregistry-dev libxkbcommon-dev \
                libei-dev libportal-dev help2man xvfb xauth -y >/dev/null
            elif [ ${{inputs.like}} == "fedora" ]; then
              dnf config-manager setopt fedora-cisco-openh264.enabled=0
              dnf install -y cmake make ninja-build gcc-c++ rpm-build openssl-devel \
                libXtst-devel libxkbfile-devel qt6-qtbase-devel qt6-qttools-devel libxkbcommon-x11-devel \
                libei-devel libxkbcommon-devel libportal-devel help2man libXinerama-devel libXrandr-devel \
                xorg-x11-server-Xvfb xorg-x11-xauth
            elif [ ${{inputs.like}} == "suse" ]; then
              zypper refresh
              zypper install -y --force-resolution \
                cmake make ninja gcc-c++ rpm-build libopenssl-devel \
                libXtst-devel libxkbfile-devel qt6-base-devel qt6-tools-devel \
                qt6-linguist-devel libxkbcommon-devel libxkbcommon-x11-devel libxkbregistry-devel \
                libei-devel libportal-devel help2man libXinerama-devel libXrandr-devel \
                xvfb-run xauth gawk
            elif [ ${{ inputs.like }} == "arch" ]; then
              pacman -Syu --noconfirm base-devel cmake ninja \
                gcc openssl libxtst libxkbfile libei libportal libxkbcommon-x11 \
                qt6-base qt6-tools qt6-svg qt6-translations qt6-declarative help2man doxygen graphviz rsync libxkbcommon libxinerama libxrandr \
                xorg-server-xvfb xorg-xauth
            else
              echo "Unknown like"
            fi
          else
            echo "Unknown OS: $RUNNER_OS"
          fi
      shell: bash
      env:
        OPENSSL_SERIES: "3.6"

    - name: Install Qt
      if: ${{runner.os != 'Linux' }}
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      env:
        AQT_CONFIG: ${{ github.workspace }}/.github/actions/install-dependencies/aqt.ini
      with:
        version: ${{inputs.qt-version}}
        cache: true
        cache-key-prefix: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.qt-version }}
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e

    # cmake/vcpkg.json.in is the single source of the vcpkg baseline
    - name: Read vcpkg baseline
      if: ${{ runner.os == 'Windows' }}
      id: vcpkg-baseline
      run: |
        rev=$(grep -o '"builtin-baseline": *"[0-9a-f]\{40\}"' cmake/vcpkg.json.in | grep -o '[0-9a-f]\{40\}' || true)
        if [ -z "$rev" ]; then
          echo "::error::no builtin-baseline commit found in cmake/vcpkg.json.in"
          exit 1
        fi
        echo "revision=$rev" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Build and cache vcpkg
      if: ${{ runner.os == 'Windows' }}
      id: vcpkg
      uses: johnwason/vcpkg-action@04c68c847bf5196ecaa72331ecf51208583916ef # v8.0.0
      with:
        pkgs: openssl
        extra-args: --classic --host-triplet=${{inputs.vcpkg-triplet}}
        triplet: ${{inputs.vcpkg-triplet}}
        token: ${{ github.token }}
        revision: ${{ steps.vcpkg-baseline.outputs.revision }}

    - name: Install Wix
      if: ${{ runner.os == 'Windows' }}
      run: |
        dotnet tool install --global wix --version 5.0.2
        wix extension add --global WixToolset.UI.wixext/5.0.2
        wix extension add --global WixToolset.Util.wixext/5.0.2
        wix extension add --global WixToolset.Firewall.wixext/5.0.2
      shell: pwsh

