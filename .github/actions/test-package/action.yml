name: "Test Package"
description: "Installs the built package and verifies the installed binaries can run (on Linux, that a client connects to a server over TLS)"

inputs:
  like:
    description: "Used only on linux distro type: debian, fedora, suse, arch"
    required: false
    default: ""

runs:
  using: "composite"

  steps:
    - name: Test package
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "macOS" ]; then
          # No loopback e2e here: OSXScreen refuses to start a server unless the process is trusted
          # for Accessibility, and a timer quits server and client once it isn't, which a hosted
          # runner can't grant without editing the TCC database behind SIP.
          dmg=$(ls build/deskflow-*.dmg | head -1)
          echo "Y" | hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/deskflow-dmg
          /tmp/deskflow-dmg/Deskflow.app/Contents/MacOS/unictrl-core --version
          hdiutil detach /tmp/deskflow-dmg

        elif [ "$RUNNER_OS" == "Windows" ]; then
          7z x build/deskflow-*-portable.zip -otmp/deskflow-pkg
          exe=$(find tmp/deskflow-pkg -name "unictrl-core.exe" -type f | head -1)
          exe_dir=$(dirname "$exe")
          pkg_root=$(dirname "$exe_dir")
          export PATH="$exe_dir:$pkg_root:$pkg_root/lib:$PATH"
          "$exe" --version

        elif [ "$RUNNER_OS" == "Linux" ]; then
          # Xvfb and openssl are for the end-to-end check below
          if [ "${{inputs.like}}" == "debian" ]; then
            apt-get install -y ./build/deskflow-*.deb xvfb openssl
          elif [ "${{inputs.like}}" == "fedora" ]; then
            dnf install -y build/deskflow-*.rpm xorg-x11-server-Xvfb openssl
          elif [ "${{inputs.like}}" == "suse" ]; then
            zypper install -y --allow-unsigned-rpm build/deskflow-*.rpm xorg-x11-server-Xvfb openssl
          elif [ "${{inputs.like}}" == "arch" ]; then
            pacman -U --noconfirm build/deskflow-*.pkg.tar.zst
            pacman -S --noconfirm --needed xorg-server-xvfb openssl
          else
            echo "Unknown like: ${{inputs.like}}"
            exit 1
          fi
          QT_QPA_PLATFORM=minimal unictrl-core --version
          timeout 120 bash "${{ github.action_path }}/e2e-linux.sh" unictrl-core

        else
          echo "Unknown OS: $RUNNER_OS"
          exit 1
        fi
